
<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Les courses de Joseph Tringali</title>

<style>

body {
    background-image: url("images/stevictoire_claire.jpg");
    background-repeat: no-repeat;
    background-position: top center;
    background-size: cover;
    margin: 0;
    padding: 0;
}

.contenu {
    background-color: rgba(255,255,255,0.05);
    margin: 30px auto;
    padding: 20px;
    width: 70%;
    border-radius: 10px;
    box-shadow: none;
}
}
}

h1 {
    text-align: center;
}

.resultats {
    margin: 20px 30px;
    padding: 10px;
    font-size: 16px;
}

.resultats input {
    width: 80px;
    padding: 5px;
    font-size: 16px;
    margin-left: 8px;
}

.resultats button {
    padding: 5px 12px;
    font-size: 16px;
    margin-left: 8px;
    cursor: pointer;
}

</style>
</head>

<body>

<p>
    <!a href="https://josephspeedy.github.io/index/index.html">
       <! ----Retour à l'accueil----   >
    <!/a>
</p>

<div class="resultats">

    <form onsubmit="ouvrirAnnee(); return false;">

        <strong>Résultats :</strong>

        <label for="annee">Année :</label>

        <input
            type="number"
            id="annee"
            name="annee"
            min="1981"
            max="2026"
            value="2026"
        >

        <button type="submit">Valider</button>

    </form>

</div>

<div class="contenu">

    <h1>Les courses de Joseph Tringali</h1>

    <p>
        Mes résultats de course à pied,
        duathlon et triathlon.
    </p>

    <p>
        Entrez une année dans le champ « Résultats ».
    </p>

</div>

<script>

function ouvrirAnnee() {

    let annee = document.getElementById("annee").value;

    if (annee >= 1981 && annee <= 2026) {

        window.location.href = "resultats/" + annee + ".html";

    } else {

        alert("Veuillez entrer une année valide entre 1981 et 2026.");

    }

}

</script>

</body>
</html>
