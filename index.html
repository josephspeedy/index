<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>Bienvenue sur le site de Joseph Tringali</title>

<style>

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background-image:
        url("images/stevictoire_claire.jpg");

    background-size: cover;

    background-position: center;

    background-attachment: fixed;

    color: #111;

}

.contenu {

    max-width: 1100px;

    margin: 30px auto;

    padding: 25px;

    background-color: rgba(255,255,255,0.05);

    border-radius: 10px;

}

h1 {

    text-align: center;

    margin-bottom: 30px;

}

h2 {

    margin-top: 30px;

}

.navigation {

    text-align: center;

    margin-bottom: 25px;

}

.navigation input {

    width: 80px;

    padding: 7px;

    font-size: 16px;

    text-align: center;

}

.navigation button {

    padding: 7px 15px;

    font-size: 16px;

    cursor: pointer;

}

.recherche {

    text-align: center;

    margin: 20px 0;

}

.recherche-lien {

    font-size: 17px;

    text-decoration: none;

    cursor: pointer;

}

#zoneRecherche {

    display: none;

    margin-top: 15px;

}

#champRecherche {

    width: 70%;

    max-width: 500px;

    padding: 9px;

    font-size: 16px;

}

#zoneRecherche button {

    padding: 9px 15px;

    font-size: 16px;

    cursor: pointer;

}

#resultatsRecherche {

    margin-top: 20px;

    text-align: left;

}

.resultat-trouve {

    margin: 15px 0;

    padding: 12px;

    background-color: rgba(255,255,255,0.20);

    border-radius: 6px;

}

.resultat-trouve a {

    font-size: 18px;

}

.ligne-resultat {

    margin-top: 8px;

    padding: 8px;

    background-color: rgba(255,255,255,0.25);

    border-radius: 5px;

}

.recherche-attente {

    font-style: italic;

}

</style>

</head>

<body>

<div class="contenu">

<h1>
Bienvenue sur le site des résultats de Joseph Tringali
</h1>

<!-- CHOIX D'UNE ANNEE -->

<div class="navigation">

```
<label for="annee">
    Choix de l'année :
</label>

<input
    type="number"
    id="annee"
    min="1981"
    max="2026"
    value="2026"
    onkeydown="
        if (event.key === 'Enter') {
            ouvrirAnnee();
        }
    "
>

<button onclick="ouvrirAnnee()">
    Valider
</button>
```

</div>

<!-- RECHERCHE -->

<div class="recherche">

```
<a
    href="#"
    class="recherche-lien"
    onclick="afficherRecherche(); return false;"
>
    🔎 Recherche sur le site
</a>


<div id="zoneRecherche">

    <form onsubmit="lancerRecherche(); return false;">

        <input
            type="text"
            id="champRecherche"
            placeholder="Nom, course, ville, année..."
            autocomplete="off"
        >

        <button type="submit">
            Rechercher
        </button>

    </form>


    <div id="resultatsRecherche"></div>

</div>
```

</div>

</div>

<script>


/* -----------------------------------------
   OUVRIR UNE ANNEE
   ----------------------------------------- */

function ouvrirAnnee() {

    let annee =
        document.getElementById("annee").value;

    annee = parseInt(annee, 10);

    if (annee >= 1981 && annee <= 2026) {

        window.open(
            "resultats/" + annee + ".html",
            "_blank"
        );

    } else {

        alert(
            "Veuillez entrer une année valide entre 1981 et 2026."
        );

    }

}


/* -----------------------------------------
   AFFICHER / MASQUER LA RECHERCHE
   ----------------------------------------- */

function afficherRecherche() {

    let zone =
        document.getElementById("zoneRecherche");

    if (zone.style.display === "block") {

        zone.style.display = "none";

    } else {

        zone.style.display = "block";

        setTimeout(function() {

            document
                .getElementById("champRecherche")
                .focus();

        }, 50);

    }

}


/* -----------------------------------------
   RECHERCHE DANS TOUTES LES ANNEES
   ----------------------------------------- */

async function lancerRecherche() {

    let recherche =
        document
            .getElementById("champRecherche")
            .value
            .trim();


    let affichage =
        document.getElementById("resultatsRecherche");


    if (recherche.length < 2) {

        affichage.innerHTML =
            "<p>Veuillez entrer au moins 2 caractères.</p>";

        return;

    }


    affichage.innerHTML =
        "<p class='recherche-attente'>Recherche en cours...</p>";


    let mot =
        recherche.toLowerCase();


    let resultats = [];


    for (
        let annee = 1981;
        annee <= 2026;
        annee++
    ) {

        try {

            let reponse =
                await fetch(
                    "resultats/" +
                    annee +
                    ".html"
                );


            if (!reponse.ok) {

                continue;

            }


            let html =
                await reponse.text();


            let page =
                new DOMParser().parseFromString(
                    html,
                    "text/html"
                );


            let lignes =
                page.querySelectorAll(
                    "table tr"
                );


            lignes.forEach(function(ligne) {

                let cellules =
                    ligne.querySelectorAll("td");


                if (cellules.length < 5) {

                    return;

                }


                let texteLigne =
                    ligne.textContent.trim();


                if (
                    texteLigne
                        .toLowerCase()
                        .includes(mot)
                ) {


                    resultats.push({

                        annee: annee,


                        date:
                            cellules[0]
                                .textContent
                                .trim(),


                        course:
                            cellules[1]
                                .textContent
                                .trim(),


                        distance:
                            cellules[2]
                                .textContent
                                .trim(),


                        temps:
                            cellules[3]
                                .textContent
                                .trim(),


                        classement:
                            cellules[4]
                                .textContent
                                .trim(),


                        url:
                            "resultats/" +
                            annee +
                            ".html"

                    });

                }

            });


        } catch (erreur) {

            continue;

        }

    }


    /* -----------------------------------------
       AUCUN RESULTAT
       ----------------------------------------- */

    if (resultats.length === 0) {

        affichage.innerHTML =

            "<p>Aucun résultat trouvé pour « " +

            echapperHTML(recherche) +

            " ».</p>";

        return;

    }


    /* -----------------------------------------
       AFFICHAGE DES RESULTATS
       ----------------------------------------- */

    let htmlResultat =

        "<p><strong>" +

        resultats.length +

        " résultat(s) trouvé(s) pour « " +

        echapperHTML(recherche) +

        " » :</strong></p>";


    resultats.forEach(function(resultat) {


        htmlResultat +=

            "<div class='resultat-trouve'>"


            +

            "<a href='" +

            resultat.url +

            "' target='_blank'>"


            +

            "<strong>" +

            resultat.annee +

            "</strong>"


            +

            "</a>"


            +

            "<div class='ligne-resultat'>"


            +

            "<strong>Date :</strong> " +

            echapperHTML(
                resultat.date
            )


            +

            "<br>"


            +

            "<strong>Course :</strong> " +

            echapperHTML(
                resultat.course
            )


            +

            "<br>"


            +

            "<strong>Distance :</strong> " +

            echapperHTML(
                resultat.distance
            )


            +

            "<br>"


            +

            "<strong>Temps :</strong> " +

            echapperHTML(
                resultat.temps
            )


            +

            "<br>"


            +

            "<strong>Classement :</strong> " +

            echapperHTML(
                resultat.classement
            )


            +

            "</div>"


            +

            "</div>";

    });


    affichage.innerHTML =
        htmlResultat;

}


/* -----------------------------------------
   PROTECTION DU TEXTE
   ----------------------------------------- */

function echapperHTML(texte) {

    return texte

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


</script>

</body>

</html>
