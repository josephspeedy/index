<!DOCTYPE html>

<html lang="fr">

<head>
<meta charset="UTF-8">

<title>Les courses de Joseph Tringali</title>

<style>

body {

    background-position: top center;

.resultats {

/* Recherche */

.recherche {

    font-size: 16px;
}

.recherche-lien {
    color: inherit;

.zone-recherche {

#resultatsRecherche {

}

.resultat-trouve {
    margin-bottom: 15px;

}

    .ligne-resultat {

}

</style>

</head>

<body>

<div class="resultats">


<form onsubmit="ouvrirAnnee(); return false;">

    <strong>Résultats :</strong>

    <label for="annee">Année :</label>

    <input
        type="number"
        id="annee"
        name="annee"
        min="1981"
        max="2026"
        value="2026"
    >

    <button type="submit">Valider</button>

</form>


</div>

<!-- RECHERCHE -->

<div class="recherche">


<a class="recherche-lien" onclick="afficherRecherche()">
    🔎 Recherche sur le site
</a>

<div class="zone-recherche" id="zoneRecherche">

    <form onsubmit="lancerRecherche(); return false;">

        <input
            type="text"
            id="champRecherche"
            placeholder="Nom, course, ville, année..."
            autocomplete="off"
        >

        <button type="submit">Rechercher</button>

    </form>

    <div id="resultatsRecherche"></div>

</div>


</div>

<div class="contenu">


<h1>Les courses de Joseph Tringali</h1>

<p>
    Mes résultats de course à pied,
    duathlon et triathlon.
</p>

<p>
    Entrez une année dans le champ « Résultats ».
</p>


</div>

<script>

/* -----------------------------------------
   OUVERTURE D'UNE ANNÉE
   ----------------------------------------- */

function ouvrirAnnee() {

    let annee = document.getElementById("annee").value;

    if (annee >= 1981 && annee <= 2026) {

        window.location.href = "resultats/" + annee + ".html";

    } else {

        alert("Veuillez entrer une année valide entre 1981 et 2026.");

    }

}


/* -----------------------------------------
   AFFICHER LA ZONE DE RECHERCHE
   ----------------------------------------- */

function afficherRecherche() {

    let zone = document.getElementById("zoneRecherche");

    if (zone.style.display === "none" || zone.style.display === "") {

        zone.style.display = "block";

        document.getElementById("champRecherche").focus();

    } else {

        zone.style.display = "none";

    }

}
/* -----------------------------------------
   RECHERCHE DANS LES PAGES
   ----------------------------------------- */

async function lancerRecherche() {

```
let recherche = document
    .getElementById("champRecherche")
    .value
    .trim();

let affichage = document.getElementById("resultatsRecherche");

if (recherche.length < 2) {

    affichage.innerHTML =
        "<p>Veuillez entrer au moins 2 caractères.</p>";

    return;
}

affichage.innerHTML =
    "<p class='recherche-attente'>Recherche en cours...</p>";

let texteRecherche = recherche.toLowerCase();

let total = 0;

let htmlResultat = "";

for (let annee = 1981; annee <= 2026; annee++) {

    try {

        let reponse = await fetch(
            "resultats/" + annee + ".html"
        );

        if (!reponse.ok) {
            continue;
        }

        let html = await reponse.text();

        let page = new DOMParser().parseFromString(
            html,
            "text/html"
        );

        /*
         * Recherche dans les lignes des tableaux.
         */

        let lignes = page.querySelectorAll("tr");

        let lignesTrouvees = [];

        lignes.forEach(function(ligne) {

            let texte = ligne.innerText
                .replace(/\s+/g, " ")
                .trim();

            if (
                texte.length > 0 &&
                texte.toLowerCase().includes(texteRecherche)
            ) {

                lignesTrouvees.push(texte);

            }

        });


        /*
         * Affichage des lignes trouvées
         */

        if (lignesTrouvees.length > 0) {

            htmlResultat +=
                "<div class='resultat-trouve'>" +

                "<a href='resultats/" +
                annee +
                ".html'>" +

                "Résultats " +
                annee +

                "</a>";


            lignesTrouvees.forEach(function(ligne) {

                total++;

                htmlResultat +=
                    "<div class='ligne-resultat'>" +
                    echapperHTML(ligne) +
                    "</div>";

            });


            htmlResultat += "</div>";

        }

    } catch (erreur) {

        /*
         * Une page qui ne peut pas être chargée
         * est simplement ignorée.
         */

    }

}


/*
 * Aucun résultat
 */

if (total === 0) {

    affichage.innerHTML =
        "<p>Aucun résultat trouvé pour « " +
        echapperHTML(recherche) +
        " ».</p>";

    return;
}


/*
 * Résultats trouvés
 */

affichage.innerHTML =
    "<p><strong>" +
    total +
    " résultat(s) trouvé(s) pour « " +
    echapperHTML(recherche) +
    " » :</strong></p>" +

    htmlResultat;
```

}

    /* -----------------------------------------
       AFFICHAGE DES RESULTATS
       ----------------------------------------- */

    if (resultats.length === 0) {

        affichage.innerHTML =
            "<p>Aucun résultat trouvé pour « " +
            echapperHTML(recherche) +
            " ».</p>";

        return;

    }


    let htmlResultat =

        "<p><strong>" +
        resultats.length +
        " page(s) trouvée(s) pour « " +
        echapperHTML(recherche) +
        " » :</strong></p>";


    resultats.forEach(function(resultat) {

        htmlResultat +=

            "<div class='resultat-trouve'>" +

            "<a href='" +
            resultat.url +
            "'>" +

            "Résultats " +
            resultat.annee +

            "</a>" +

            "<br>" +

            "Le terme recherché apparaît dans la page." +

            "</div>";

    });


    affichage.innerHTML = htmlResultat;

}


/* -----------------------------------------
   PROTECTION DU TEXTE AFFICHÉ
   ----------------------------------------- */

function echapperHTML(texte) {

    return texte
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
