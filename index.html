<!DOCTYPE html>

<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Les courses de Joseph Tringali</title>

<style>

body {
    background-image: url("images/stevictoire_claire.jpg");
    background-repeat: no-repeat;
    background-position: top center;
    background-size: cover;
    margin: 0;
    padding: 0;
}

.contenu {
    background-color: rgba(255,255,255,0.05);
    margin: 30px auto;
    padding: 20px;
    width: 70%;
    border-radius: 10px;
    box-shadow: none;
}

h1 {
    text-align: center;
}

.resultats {
    margin: 20px 30px;
    padding: 10px;
    font-size: 16px;
}

.resultats input {
    width: 80px;
    padding: 5px;
    font-size: 16px;
    margin-left: 8px;
}

.resultats button {
    padding: 5px 12px;
    font-size: 16px;
    margin-left: 8px;
    cursor: pointer;
}


/* -----------------------------------------
   RECHERCHE
   ----------------------------------------- */

.recherche {
    margin: 20px 30px;
    padding: 10px;
    font-size: 16px;
}

.recherche-lien {
    color: inherit;
    text-decoration: underline;
    cursor: pointer;
    font-weight: bold;
}

.zone-recherche {
    display: none;
    margin-top: 15px;
}

.zone-recherche input {
    width: 250px;
    max-width: 70%;
    padding: 7px;
    font-size: 16px;
}

.zone-recherche button {
    padding: 7px 12px;
    font-size: 16px;
    margin-left: 5px;
    cursor: pointer;
}

#resultatsRecherche {
    margin-top: 20px;
}

.resultat-trouve {
    margin-bottom: 15px;
    padding: 10px;
    background-color: rgba(255,255,255,0.35);
    border-radius: 6px;
}

.resultat-trouve a {
    font-weight: bold;
    color: inherit;
}

.ligne-resultat {
    margin-top: 8px;
    padding: 8px;
    background-color: rgba(255,255,255,0.25);
    border-radius: 5px;
}

.recherche-attente {
    font-style: italic;
}

.recherche-erreur {
    color: darkred;
}

</style>

</head>


<body>


<!-- -----------------------------------------
     CHOIX DE L'ANNEE
     ----------------------------------------- -->

<div class="resultats">

<form onsubmit="ouvrirAnnee(); return false;">

    <strong>Résultats :</strong>

    <label for="annee">Année :</label>

    <input
        type="number"
        id="annee"
        name="annee"
        min="1981"
        max="2026"
        value="2026"
    >

    <button type="submit">Valider</button>

</form>

</div>


<!-- -----------------------------------------
     RECHERCHE
     ----------------------------------------- -->

<div class="recherche">

<a
    href="#"
    class="recherche-lien"
    onclick="afficherRecherche(); return false;"
>
    🔎 Recherche sur le site
</a>


<div class="zone-recherche" id="zoneRecherche">

    <form onsubmit="lancerRecherche(); return false;">

        <input
            type="text"
            id="champRecherche"
            placeholder="Nom, course, ville, année..."
            autocomplete="off"
        >

        <button type="submit">
            Rechercher
        </button>

    </form>

    <div id="resultatsRecherche"></div>

</div>

</div>


<!-- -----------------------------------------
     CONTENU PRINCIPAL
     ----------------------------------------- -->

<div class="contenu">

<h1>Les courses de Joseph Tringali</h1>

<p>
    Mes résultats de course à pied,
    duathlon et triathlon.
</p>

<p>
    Entrez une année dans le champ « Résultats ».
</p>

</div>


<script>


/* -----------------------------------------
   OUVERTURE D'UNE ANNEE
   ----------------------------------------- */

function ouvrirAnnee() {

    let annee =
        document.getElementById("annee").value;

    annee = parseInt(annee, 10);

    if (annee >= 1981 && annee <= 2026) {

        window.open(
            "resultats/" + annee + ".html",
            "_blank"
        );

    } else {

        alert(
            "Veuillez entrer une année valide entre 1981 et 2026."
        );

    }

}


/* -----------------------------------------
   AFFICHER / MASQUER LA RECHERCHE
   ----------------------------------------- */

function afficherRecherche() {

    let zone =
        document.getElementById("zoneRecherche");

    if (zone.style.display === "block") {

        zone.style.display = "none";

    } else {

        zone.style.display = "block";

        setTimeout(function() {

            document
                .getElementById("champRecherche")
                .focus();

        }, 50);

    }

}


/* -----------------------------------------
   RECHERCHE DANS LES PAGES
   ----------------------------------------- */

async function lancerRecherche() {

    const recherche =
        document.getElementById("champRecherche").value.trim();

    const affichage =
        document.getElementById("resultatsRecherche");

    if (recherche.length < 2) {
        affichage.innerHTML =
            "<p>Veuillez entrer au moins 2 caractères.</p>";
        return;
    }

    affichage.innerHTML =
        "<p class='recherche-attente'>Recherche en cours...</p>";

    const mot =
        recherche.toLowerCase();

    let resultats = [];

    for (let annee = 1981; annee <= 2026; annee++) {

        try {

            const reponse =
                await fetch("resultats/" + annee + ".html");

            if (!reponse.ok) {
                continue;
            }

            const texte =
                await reponse.text();

            const page =
                new DOMParser().parseFromString(
                    texte,
                    "text/html"
                );

            const lignes =
                page.querySelectorAll("tr");

            lignes.forEach(function(ligne) {

                const cellules =
                    ligne.querySelectorAll("td");

                if (cellules.length === 0) {
                    return;
                }

                const contenu =
                    ligne.textContent.trim();

                if (
                    contenu.toLowerCase().includes(mot)
                ) {

                    resultats.push({
                        annee: annee,
                        date: cellules[0].textContent.trim(),
                        course: cellules[1].textContent.trim(),
                        distance: cellules[2].textContent.trim(),
                        temps: cellules[3].textContent.trim(),
                        classement: cellules[4].textContent.trim()
                    });

                }

            });

        } catch (e) {

            continue;

        }

    }


    if (resultats.length === 0) {

        affichage.innerHTML =
            "<p>Aucun résultat trouvé pour « " +
            echapperHTML(recherche) +
            " ».</p>";

        return;
    }


    let sortie =
        "<p><strong>" +
        resultats.length +
        " résultat(s) trouvé(s) :</strong></p>";


    resultats.forEach(function(r) {

        sortie +=
            "<div class='resultat-trouve'>" +

            "<a href='resultats/" +
            r.annee +
            ".html' target='_blank'>" +

            "<strong>" +
            r.annee +
            "</strong>" +

            "</a>" +

            "<div class='ligne-resultat'>" +

            echapperHTML(r.date) +
            " — " +

            echapperHTML(r.course) +
            " — " +

            echapperHTML(r.distance) +
            " — " +

            echapperHTML(r.temps) +
            " — " +

            echapperHTML(r.classement) +

            "</div>" +

            "</div>";

    });


    affichage.innerHTML = sortie;

}


    /* -----------------------------------------
       RECHERCHE DANS TOUTES LES ANNEES
       ----------------------------------------- */

    for (
        let annee = 1981;
        annee <= 2026;
        annee++
    ) {

        try {

            let reponse =
                await fetch(
                    "resultats/" +
                    annee +
                    ".html"
                );


            if (!reponse.ok) {
                continue;
            }


            let html =
                await reponse.text();


            let page =
                new DOMParser().parseFromString(
                    html,
                    "text/html"
                );


            let lignes =
                page.querySelectorAll("table tr");


            lignes.forEach(function(ligne) {

                let cellules =
                    ligne.querySelectorAll("td");


                /*
                   On ignore l'en-tête du tableau.
                */

                if (cellules.length < 5) {
                    return;
                }


                /*
                   Texte complet de la ligne.
                */

                let texteLigne =
                    ligne.innerText.trim();


                /*
                   Recherche dans toute la ligne :
                   date, course, distance, temps,
                   classement, etc.
                */

                if (
                    texteLigne
                        .toLowerCase()
                        .includes(texteRecherche)
                ) {

                    resultats.push({

                        annee: annee,

                        date:
                            cellules[0].innerText.trim(),

                        course:
                            cellules[1].innerText.trim(),

                        distance:
                            cellules[2].innerText.trim(),

                        temps:
                            cellules[3].innerText.trim(),

                        classement:
                            cellules[4].innerText.trim(),

                        url:
                            "resultats/" +
                            annee +
                            ".html"

                    });

                }

            });


        } catch (erreur) {

            /*
               Une année absente est ignorée.
            */

        }

    }


    /* -----------------------------------------
       AUCUN RESULTAT
       ----------------------------------------- */

    if (resultats.length === 0) {

        affichage.innerHTML =
            "<p>Aucun résultat trouvé pour « " +
            echapperHTML(recherche) +
            " ».</p>";

        return;

    }


    /* -----------------------------------------
       AFFICHAGE
       ----------------------------------------- */

    let htmlResultat =

        "<p><strong>" +
        resultats.length +
        " résultat(s) trouvé(s) pour « " +
        echapperHTML(recherche) +
        " » :</strong></p>";


    resultats.forEach(function(resultat) {

        htmlResultat +=

            "<div class='resultat-trouve'>" +

            "<a href='" +
            resultat.url +
            "' target='_blank'>" +

            "<strong>" +
            resultat.annee +
            "</strong>" +

            "</a>" +

            "<div class='ligne-resultat'>" +

            "<strong>Date :</strong> " +
            echapperHTML(resultat.date) +

            "<br>" +

            "<strong>Course :</strong> " +
            echapperHTML(resultat.course) +

            "<br>" +

            "<strong>Distance :</strong> " +
            echapperHTML(resultat.distance) +

            "<br>" +

            "<strong>Temps :</strong> " +
            echapperHTML(resultat.temps) +

            "<br>" +

            "<strong>Classement :</strong> " +
            echapperHTML(resultat.classement) +

            "</div>" +

            "</div>";

    });


    affichage.innerHTML =
        htmlResultat;

}
    /* -----------------------------------------
       AUCUN RESULTAT
       ----------------------------------------- */

    if (resultats.length === 0) {

        affichage.innerHTML =
            "<p>Aucun résultat trouvé pour « " +
            echapperHTML(recherche) +
            " ».</p>";

        return;

    }


    /* -----------------------------------------
       AFFICHAGE
       ----------------------------------------- */

    let nombreLignes = 0;


    resultats.forEach(function(resultat) {

        nombreLignes +=
            resultat.lignes.length;

    });


    let htmlResultat =

        "<p><strong>" +
        nombreLignes +
        " résultat(s) trouvé(s) pour « " +
        echapperHTML(recherche) +
        " » :</strong></p>";


    resultats.forEach(function(resultat) {

        htmlResultat +=

            "<div class='resultat-trouve'>" +

            "<a href='" +
            resultat.url +
            "' target='_blank'>" +

            "Résultats " +
            resultat.annee +

            "</a>";


        resultat.lignes.forEach(function(ligne) {

            htmlResultat +=

                "<div class='ligne-resultat'>" +

                echapperHTML(ligne) +

                "</div>";

        });


        htmlResultat +=

            "</div>";

    });


    affichage.innerHTML =
        htmlResultat;

}


/* -----------------------------------------
   PROTECTION DU TEXTE
   ----------------------------------------- */

function echapperHTML(texte) {

    return texte

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}

</script>


</body>

</html>
