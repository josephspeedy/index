<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Les courses de Joseph Tringali</title>

<style>

body {
    background-image: url("images/stevictoire_claire.jpg");
    background-repeat: no-repeat;
   
    background-position: top center;
    background-size: cover;
}
}

.menu {
    background-color: #333;
    padding: 0;
}

.dropbtn {
    background-color: #333;
    color: white;
    padding: 12px;
    font-size: 14px;
    border: none;
    cursor: pointer;
}

.dropbtn:hover {
    background-color: #555;
}

.dropdown {
    position: relative;
    display: inline-block;
}

.dropdown-content {
    display: none;
    position: absolute;
    background-color: white;
    min-width: 180px;
    box-shadow: 0px 8px 12px rgba(0,0,0,0.3);
    z-index: 1;
}

.dropdown-content a {
    color: black;
    padding: 8px 12px;
    text-decoration: none;
    display: block;
}

.dropdown-content a:hover {
    background-color: #f0f0f0;
}

.show {
    display: block;
}

.contenu {
    background-color: rgba(255,255,255,0.45);
    margin: 30px auto;
    padding: 20px;
    width: 70%;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
}
h1 {
    text-align: center;
}

</style>
</head>

<body>
<p><a href="index.html">Retour à l'accueil</a></p>
<div class="menu">

    <label for="anneeResultat"><strong>Résultats :</strong></label>

    <select id="anneeResultat"
            onchange="if(this.value) window.location.href=this.value;">

        <option value="">Choisir une année</option>

        <option value="resultats/2026.html">2026</option>
        <option value="resultats/2025.html">2025</option>
        <option value="resultats/2024.html">2024</option>
        <option value="resultats/2023.html">2023</option>
        <option value="resultats/2022.html">2022</option>
        <option value="resultats/2021.html">2021</option>
        <option value="resultats/2020.html">2020</option>
        <option value="resultats/2019.html">2019</option>
        <option value="resultats/2018.html">2018</option>
        <option value="resultats/2017.html">2017</option>
        <option value="resultats/2016.html">2016</option>
        <option value="resultats/2015.html">2015</option>
        <option value="resultats/2014.html">2014</option>
        <option value="resultats/2013.html">2013</option>
        <option value="resultats/2012.html">2012</option>
        <option value="resultats/2012.html">2005</option>
        <option value="resultats/2004.html">2004</option>
        <option value="resultats/2003.html">2003</option>

    </select>

</div>
</div>

<div class="contenu">

    <h1>Les courses de Joseph Tringali</h1>

    <p>
        Mes résultats de course à pied,
        duathlon et triathlon.
    </p>

    <p>
        Sélectionnez une année dans le menu « Résultats ».
    </p>

</div>

<script>

function ouvrirMenu() {
    document.getElementById("menuResultats").classList.toggle("show");
}

window.onclick = function(event) {

    if (!event.target.matches('.dropbtn')) {

        var dropdowns = document.getElementsByClassName("dropdown-content");

        for (var i = 0; i < dropdowns.length; i++) {

            var openDropdown = dropdowns[i];

            if (openDropdown.classList.contains('show')) {
                openDropdown.classList.remove('show');
            }
        }
    }
}

</script>

</body>
</html>
