<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Les courses de Joseph Tringali</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;

    background-image: url("https://josephspeedy.github.io/index/images/stevictoire_claire.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.menu {
    background-color: #333;
    padding: 0;
}

.dropbtn {
    background-color: #333;
    color: white;
    padding: 16px;
    font-size: 18px;
    border: none;
    cursor: pointer;
}

.dropbtn:hover {
    background-color: #555;
}

.dropdown {
    position: relative;
    display: inline-block;
}

.dropdown-content {
    display: none;
    position: absolute;
    background-color: white;
    min-width: 180px;
    box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
    z-index: 1;
}

.dropdown-content a {
    color: black;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
}

.dropdown-content a:hover {
    background-color: #f0f0f0;
}

.show {
    display: block;
}

.contenu {
    background-color: rgba(255,255,255,0.85);
    margin: 30px;
    padding: 20px;
    border-radius: 10px;
}

h1 {
    text-align: center;
}

</style>
</head>

<body>
<p><a href="index.html">Retour à l'accueil</a></p>
<div class="menu">

    <div class="dropdown">

        <button onclick="ouvrirMenu()" class="dropbtn" target="blank">
            Résultats ▼
        </button>

        <div id="menuResultats" class="dropdown-content">

            <a href="resultats/2026.html"target="_blank">2026 </a>
            <a href="resultats/2025.html"target="_blank">2025 </a>
            <a href="resultats/2024.html"target="_blank">2024 </a>
            <a href="resultats/2023.html"target="_blank">2023 </a>
            <a href="resultats/2022.html"target="_blank">2022 </a>
            <a href="resultats/2012.html"target="_blank">2012 </a>


        </div>

    </div>

</div>

<div class="contenu">

    <h1>Les courses de Joseph Tringali</h1>

    <p>
        Mes résultats de course à pied,
        duathlon et triathlon.
    </p>

    <p>
        Sélectionnez une année dans le menu « Résultats ».
    </p>

</div>

<script>

function ouvrirMenu() {
    document.getElementById("menuResultats").classList.toggle("show");
}

window.onclick = function(event) {

    if (!event.target.matches('.dropbtn')) {

        var dropdowns = document.getElementsByClassName("dropdown-content");

        for (var i = 0; i < dropdowns.length; i++) {

            var openDropdown = dropdowns[i];

            if (openDropdown.classList.contains('show')) {
                openDropdown.classList.remove('show');
            }
        }
    }
}

</script>

</body>
</html>
