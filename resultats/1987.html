<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-image: url("https://josephspeedy.github.io/index/images/stevictoire_claire.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.menu {
    background-color: #333;
    padding: 0;
}

.dropbtn {
    background-color: #333;
    color: white;
    padding: 16px;
    font-size: 18px;
    border: none;
    cursor: pointer;
}

.dropbtn:hover {
    background-color: #555;
}

.dropdown {
    position: relative;
    display: inline-block;
}

.dropdown-content {
    display: none;
    position: absolute;
    background-color: white;
    min-width: 180px;
    box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
    z-index: 1;
}

.dropdown-content a {
    color: black;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
}

.dropdown-content a:hover {
    background-color: #f0f0f0;
}

.show {
    display: block;
}

.contenu {
    background-color: rgba(255,255,255,0.85);
    margin: 30px;
    padding: 20px;
    border-radius: 10px;
}

h1 {
    text-align: center;
}

</style>

</head>

<body>

</html>
