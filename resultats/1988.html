
<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;

    background-image: url("https://josephspeedy.github.io/index/images/stevictoire_claire.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.menu {
    background-color: #333;
    padding: 0;
}

.dropbtn {
    background-color: #333;
    color: white;
    padding: 16px;
    font-size: 18px;
    border: none;
    cursor: pointer;
}

.dropbtn:hover {
    background-color: #555;
}

.dropdown {
    position: relative;
    display: inline-block;
}

.dropdown-content {
    display: none;
    position: absolute;
    background-color: white;
    min-width: 180px;
    box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
    z-index: 1;
}

.dropdown-content a {
    color: black;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
}

.dropdown-content a:hover {
    background-color: #f0f0f0;
}

.show {
    display: block;
}

.contenu {
    background-color: rgba(255,255,255,0.85);
    margin: 30px;
    padding: 20px;
    border-radius: 10px;
}

h1 {
    text-align: center;
}

/* Ajout du choix de l'année */

.resultats {
    margin: 20px 30px;
    padding: 10px;
    font-size: 16px;
}

.resultats input {
    width: 80px;
    padding: 5px;
    font-size: 16px;
    margin-left: 8px;
}

.resultats button {
    padding: 5px 12px;
    font-size: 16px;
    margin-left: 8px;
    cursor: pointer;
}

</style>

</head>

<body>

<!-- Choix de l'année -->

<div class="resultats">


<form onsubmit="ouvrirAnnee(); return false;">

    <strong> Choix: </strong>

    <label for="annee">Année :</label>

    <input
        type="number"
        id="annee"
        name="annee"
        min="1981"
        max="2026"
        value="1988"
    >

    <button type="submit">Valider</button>

</form>


</div>

<h1>Résultats 1988</h1>

<p><a href="https://josephspeedy.github.io/index/index.html">Retour à l'accueil</a></p>

<table border="1">
<tr>
    <th>Date</th>
    <th>Course</th>
    <th>Distance</th>
    <th>Temps</th>
    <th>Classement</th>
    <th> Premier homme</th>
    <th> Première femme</th>
    <th>Classés </th>
</tr>

<tr>
    <td>03/04/1988</td>
    <td>Nice</td>
    <td>42,20 km</td>
    <td>03:31:58</td>
    <td>307e</td>
    <td>Lazare (02:17:48)</td>
    <td>XXX XXX (xx:xx:xx)</td>
    <td>611</td>
</tr>

<tr>
    <td>10/04/1988</td>
    <td>Crest</td>
    <td>21,10 km</td>
    <td>01:41:59</td>
    <td>117e</td>
    <td>Ricardi (01:12:45)</td>
    <td>Riou Chantal (01:34:25)</td>
    <td>305</td>
</tr>

</table>

<script>

function ouvrirAnnee() {

    let annee = document.getElementById("annee").value;

    if (annee >= 1981 && annee <= 2026) {

        window.location.href = annee + ".html";

    } else {

        alert("Veuillez entrer une année valide entre 1981 et 2026.");

    }

}

</script>

</body>
</html>
