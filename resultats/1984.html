


<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-image: url("https://josephspeedy.github.io/index/images/stevictoire_claire.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.menu {
    background-color: #333;
    padding: 0;
}

.dropbtn {
    background-color: #333;
    color: white;
    padding: 16px;
    font-size: 18px;
    border: none;
    cursor: pointer;
}

.dropbtn:hover {
    background-color: #555;
}

.dropdown {
    position: relative;
    display: inline-block;
}

.dropdown-content {
    display: none;
    position: absolute;
    background-color: white;
    min-width: 180px;
    box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
    z-index: 1;
}

.dropdown-content a {
    color: black;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
}

.dropdown-content a:hover {
    background-color: #f0f0f0;
}

.show {
    display: block;
}

.contenu {
    background-color: rgba(255,255,255,0.85);
    margin: 30px;
    padding: 20px;
    border-radius: 10px;
}

h1 {
    text-align: center;
}

.resultats {
    margin: 20px 30px;
    padding: 10px;
    font-size: 16px;
}

.resultats input {
    width: 80px;
    padding: 5px;
    font-size: 16px;
    margin-left: 8px;
}

.resultats button {
    padding: 5px 12px;
    font-size: 16px;
    margin-left: 8px;
    cursor: pointer;
}

</style>
</head>

<body>

<div class="resultats">

    <form onsubmit="ouvrirAnnee(); return false;">

        <strong>Résultats :</strong>

        <label for="annee">Année :</label>

        <input
            type="number"
            id="annee"
            name="annee"
            min="1981"
            max="2026"
            value="1984"
        >

        <button type="submit">Valider</button>

    </form>

</div>

<h1>Résultats 1984</h1>

<p>
<a href="https://josephspeedy.github.io/index/index.html">
Retour à l'accueil
</a>
</p>

<table border="1">

<tr>
<th>Date</th>
<th>Course</th>
<th>Distance</th>
<th>Temps</th>
<th>Classement</th>
<th>Premier homme</th>
<th>Première femme</th>
<th>Classés</th>
</tr>

<tr>
<td>11/03/1984</td>
<td>Marathon de Marseille</td>
<td>42,2 km</td>
<td>03:48:00</td>
<td>xxx e</td>
<td>Geffray Christian (02:17:50)</td>
<td>Rai Fabienne (03:07:25)</td>
<td>2700</td>
</tr>

</table>

<script>

function ouvrirAnnee() {

    let annee = document.getElementById("annee").value;

    if (annee >= 1981 && annee <= 2026) {

        window.location.href = annee + ".html";

    } else {

        alert("Veuillez entrer une année valide entre 1981 et 2026.");

    }

}

</script>

</body>
</html>
